# Traefik as shipped by k3s, configured through a HelmChartConfig (the chart itself belongs to k3s).
#
# externalTrafficPolicy: Local keeps the visitor's real address. With the default (Cluster), the
# k3s service load balancer rewrites every connection's source to the node's pod gateway
# (10.42.0.1): Traefik then forwards X-Forwarded-For: 10.42.0.1 for everyone, and every rate
# limit of the app (src/lib/rate-limit.ts, getClientIp) becomes a single bucket shared by all
# visitors — one busy hour on the invite check locked every invite link. On this single-node
# cluster, Local has no downside: the only node runs Traefik.
#
# Access logs stay on for supervision, but never for a request carrying a personal token: those
# are routed by k8s/ingressroute-tokens.yaml with access logs off (benevol.app only; the global
# settings here are unchanged for the other sites). Every request header is dropped except
# User-Agent (owner decision 2026-10-22: tells bots from people in the daily totals); Referer,
# cookies and authorisation headers never reach the log.
#
# Access logs go to a JSON file on the node, /var/log/traefik/access.log (hostPath), not to
# stdout: kubelet keeps only 5 x 10 MiB of container output, about 4 hours of access logs. The
# node rotates the file daily into /var/log/traefik-archive (root only) and keeps one year
# (k8s/node/traefik-access.logrotate); before a line is 90 days old its client address is cut to
# its /24 (IPv4) or /48 (IPv6) network and the User-Agent dropped (k8s/node/traefik-log-anonymise).
# A daily job keeps per-page totals of the benevol.app requests, without addresses
# (k8s/node/traefik-log-stats). Procedure, checks and rollback:
# k8s/log-rotation.md.
#
# The directory must exist on the node and be writable by the Traefik user (65532) BEFORE this is
# applied. type: Directory makes a missing directory fail loudly: the new pod stays in
# ContainerCreating and the old one keeps serving (rolling update, maxUnavailable 0). A directory
# that exists but is not writable is worse: Traefik starts, logs « Unable to create access
# logger » and writes no access log at all; check that the file grows after applying.
#
# This Traefik also serves other sites of the cluster (gallerypack.app, deck.altsessions.ch): they
# get the real client address too, and their requests land in the same access-log file. Applying
# it recreates the Traefik pod (and the svclb pod when the service changes): a few seconds of
# reconnects for every site.
#
#   kubectl apply -f k8s/traefik-config.yaml
#   kubectl -n kube-system get svc traefik -o jsonpath='{.spec.externalTrafficPolicy}'   # → Local
#   kubectl -n kube-system get deploy traefik -o jsonpath='{.spec.template.spec.containers[0].args}' | tr , '\n' | grep accesslog
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    logs:
      access:
        enabled: true
        format: json
        filePath: /var/log/traefik/access.log
        fields:
          headers:
            defaultmode: drop
            names:
              User-Agent: keep
    deployment:
      additionalVolumes:
        - name: access-logs
          hostPath:
            path: /var/log/traefik
            type: Directory
    additionalVolumeMounts:
      - name: access-logs
        mountPath: /var/log/traefik
    additionalArguments:
      - "--entryPoints.web.transport.respondingTimeouts.readTimeout=30m"
      - "--entryPoints.web.transport.respondingTimeouts.writeTimeout=30m"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=30m"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=30m"
    service:
      spec:
        externalTrafficPolicy: Local
