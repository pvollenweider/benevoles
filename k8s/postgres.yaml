apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: benevoles
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: benevoles
spec:
  replicas: 1
  # Never two PostgreSQL servers on the same data directory: the old pod stops before the new one
  # starts (a rolling update would start the new one first, on the same local-path volume).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # PostgreSQL never calls the Kubernetes API (#1050).
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          # The image's entrypoint starts as root, makes sure the data directory belongs to the
          # postgres user (uid 70), then drops to it with su-exec: it keeps only the capabilities
          # it needs for that, and the server itself runs as uid 70 (#1050). The data volume keeps
          # its current ownership: no runAsUser, no fsGroup.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
          env:
            - name: POSTGRES_DB
              value: benevoles
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: benevoles-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: benevoles-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              # `-U $(POSTGRES_USER)` was not resolved by the probe: Postgres logged
              # `FATAL: role "root" does not exist` every 5 s. Use a shell instead.
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d benevoles']
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: benevoles
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
