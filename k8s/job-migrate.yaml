# One-off database migration, run by the deploy workflow before the app Deployment is updated
# (#314). Uses the image being deployed; the app pods themselves no longer migrate on start
# (MIGRATE_ON_START=false in deployment.yaml). docker-entrypoint.sh waits for Postgres, runs
# `prisma migrate deploy`, then execs the command (`true`, so the Job just completes).
apiVersion: batch/v1
kind: Job
metadata:
  name: benevoles-migrate
  namespace: benevoles
  labels:
    app: benevoles-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: benevoles-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-secret
      # Same image and same restrictions as the app (k8s/deployment.yaml, #1050).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ${APP_IMAGE}
          args: ["true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # The entrypoint and `prisma migrate deploy` (prisma.config.ts) read only DATABASE_URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: benevoles-secret
                  key: DATABASE_URL
            - name: NODE_ENV
              value: production
            - name: MIGRATE_ON_START
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
