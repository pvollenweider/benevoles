# ⚠️  Ne pas committer avec de vraies valeurs.
# Appliquer manuellement sur le cluster :
#
#   kubectl create secret generic benevoles-secret \
#     --namespace=benevoles \
#     --from-literal=DATABASE_URL="postgresql://user:pass@host:5432/benevoles" \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=SMTP_HOST="smtp.example.com" \
#     --from-literal=SMTP_PORT="587" \
#     --from-literal=SMTP_SECURE="false" \
#     --from-literal=SMTP_USER="user@example.com" \
#     --from-literal=SMTP_PASSWORD="motdepasse" \
#     --from-literal=EMAIL_FROM="no-reply@votre-domaine.com" \
#     --from-literal=ADMIN_NOTIFICATION_EMAIL="" \
#     --from-literal=NEXT_PUBLIC_APP_URL="http://benevoles.gallerypack.app" \
#     --save-config --dry-run=client -o yaml | kubectl apply -f -
#
# Ce fichier documente les clés attendues.
apiVersion: v1
kind: Secret
metadata:
  name: benevoles-secret
  namespace: benevoles
type: Opaque
stringData:
  DATABASE_URL: "CHANGEME"
  AUTH_SECRET: "CHANGEME"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  EMAIL_FROM: "no-reply@votre-domaine.com"
  ADMIN_NOTIFICATION_EMAIL: ""
  NEXT_PUBLIC_APP_URL: "http://benevoles.gallerypack.app"
