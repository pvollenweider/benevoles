# ⚠️  Ne pas committer avec de vraies valeurs.
# Les secrets sont gérés via GitHub Actions (gh secret set).
# Ce fichier documente les clés attendues.
apiVersion: v1
kind: Secret
metadata:
  name: benevoles-secret
  namespace: benevoles
type: Opaque
stringData:
  # PostgreSQL (utilisé aussi par le pod postgres)
  POSTGRES_USER: "CHANGEME"
  POSTGRES_PASSWORD: "CHANGEME"
  DATABASE_URL: "postgresql://CHANGEME:CHANGEME@postgres:5432/benevoles"
  # App
  AUTH_SECRET: "CHANGEME"
  ADMIN_EMAIL: "CHANGEME"
  ADMIN_PASSWORD: "CHANGEME"
  CRON_SECRET: "CHANGEME"
  # Encryption of volunteer-facing link tokens (#290): 32 random bytes, base64
  # (`openssl rand -base64 32`). Required in production: the app won't start without it.
  # Never lose it: encrypted tokens can't be recovered without it (keep a copy with the other
  # secrets). To rotate it (#313), see docs/configuration.md "Rotation de la clé de chiffrement".
  TOKEN_ENCRYPTION_KEY: ""
  # Id stored in every value encrypted with TOKEN_ENCRYPTION_KEY (default "k1").
  TOKEN_ENCRYPTION_KEY_ID: ""
  # Previous keys, still needed to read old values during a rotation: "id:base64,id:base64".
  TOKEN_ENCRYPTION_PREVIOUS_KEYS: ""
  # Backup encryption passphrase (used by cronjob-backup)
  BACKUP_PASSPHRASE: "CHANGEME"
  # Off-site backup copy (#524): bucket name for the Swiss Backup S3 remote, restricted to a
  # dedicated key. Ignored while OFFSITE_PROVIDER stays "dropbox" (k8s/cronjob-backup-offsite.yaml).
  OFFSITE_BUCKET: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  EMAIL_FROM: "Bénévoles <notifications@benevol.app>"
  EMAIL_REPLY_TO: "contact@benevol.app"
  ADMIN_NOTIFICATION_EMAIL: ""
  NEXT_PUBLIC_APP_URL: "https://www.benevol.app"
