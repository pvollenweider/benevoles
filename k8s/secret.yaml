# ⚠️  Ne pas committer avec de vraies valeurs.
# Les secrets sont gérés via GitHub Actions (gh secret set).
# Ce fichier documente les clés attendues.
apiVersion: v1
kind: Secret
metadata:
  name: benevoles-secret
  namespace: benevoles
type: Opaque
stringData:
  # PostgreSQL (utilisé aussi par le pod postgres)
  POSTGRES_USER: "CHANGEME"
  POSTGRES_PASSWORD: "CHANGEME"
  DATABASE_URL: "postgresql://CHANGEME:CHANGEME@postgres:5432/benevoles"
  # App
  AUTH_SECRET: "CHANGEME"
  ADMIN_EMAIL: "CHANGEME"
  ADMIN_PASSWORD: "CHANGEME"
  CRON_SECRET: "CHANGEME"
  # Backup encryption passphrase (used by cronjob-backup)
  BACKUP_PASSPHRASE: "CHANGEME"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  EMAIL_FROM: "Bénévoles <notifications@benevol.app>"
  EMAIL_REPLY_TO: "contact@benevol.app"
  ADMIN_NOTIFICATION_EMAIL: ""
  NEXT_PUBLIC_APP_URL: "https://www.benevol.app"
