# ⚠️  Ne pas committer avec de vraies valeurs.
# Les secrets sont gérés via GitHub Actions (gh secret set).
# Ce fichier documente les clés attendues.
apiVersion: v1
kind: Secret
metadata:
  name: benevoles-secret
  namespace: benevoles
type: Opaque
stringData:
  # PostgreSQL. POSTGRES_USER / POSTGRES_PASSWORD : superutilisateur, lu par le pod postgres et la
  # sauvegarde seulement. Application : rôle benevoles_app ; Job de migration : rôle
  # benevoles_owner (docs/deploiement.md, « Rôles PostgreSQL »). Mots de passe hexadécimaux.
  POSTGRES_USER: "CHANGEME"
  POSTGRES_PASSWORD: "CHANGEME"
  DATABASE_URL: "postgresql://benevoles_app:CHANGEME@postgres:5432/benevoles"
  MIGRATE_DATABASE_URL: "postgresql://benevoles_owner:CHANGEME@postgres:5432/benevoles"
  # App
  AUTH_SECRET: "CHANGEME"
  ADMIN_EMAIL: "CHANGEME"
  ADMIN_PASSWORD: "CHANGEME"
  CRON_SECRET: "CHANGEME"
  # Encryption of volunteer-facing link tokens (#290): 32 random bytes, base64
  # (`openssl rand -base64 32`). Required in production: the app won't start without it.
  # Never lose it: encrypted tokens can't be recovered without it (keep a copy with the other
  # secrets). To rotate it (#313), see docs/configuration.md "Rotation de la clé de chiffrement".
  TOKEN_ENCRYPTION_KEY: ""
  # Id stored in every value encrypted with TOKEN_ENCRYPTION_KEY (default "k1").
  TOKEN_ENCRYPTION_KEY_ID: ""
  # Previous keys, still needed to read old values during a rotation: "id:base64,id:base64".
  TOKEN_ENCRYPTION_PREVIOUS_KEYS: ""
  # Backup encryption passphrase (used by cronjob-backup, gpg symmetric encryption). A single
  # line: gpg reads the passphrase up to the first line break.
  BACKUP_PASSPHRASE: "CHANGEME"
  # Off-site backup copy (#524): container name on the Swiss Backup (Swift) remote, required by k8s/cronjob-backup-offsite.yaml.
  OFFSITE_BUCKET: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  # Deferred bounces (#602): optional IMAPS mailbox, read every 15 minutes by the app-bounces
  # CronJob. Without IMAP_USER and IMAP_PASSWORD the reader is off and the health page says
  # « non configuré ». IMAP_HOST defaults to mail.gandi.net, IMAP_PORT to 993 (IMAPS only);
  # IMAP_PROCESSED_FOLDER defaults to « Rejets traités ».
  IMAP_HOST: ""
  IMAP_PORT: "993"
  IMAP_USER: ""
  IMAP_PASSWORD: ""
  IMAP_PROCESSED_FOLDER: "Rejets traités"
  EMAIL_FROM: "benevol.app <notifications@benevol.app>"
  EMAIL_REPLY_TO: "contact@benevol.app"
  ADMIN_NOTIFICATION_EMAIL: ""
  NEXT_PUBLIC_APP_URL: "https://www.benevol.app"
