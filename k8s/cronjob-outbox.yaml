# Appelle POST /api/cron/outbox toutes les 5 minutes.
# Envoie les emails arrivés à échéance, surtout l'email groupé « inscrit par un organisateur »
# (#916), qui attend quelques minutes après le dernier ajout pour regrouper tous les créneaux.
# L'endpoint est idempotent : chaque email est réservé avant l'envoi et part une seule fois.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-outbox
  namespace: benevoles
spec:
  schedule: "*/5 * * * *"   # toutes les 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # Restricted pod (#1050): curl_user (uid 100, gid 101) of the image, given as numbers for
          # runAsNonRoot; read-only root filesystem, the response body goes to an emptyDir /tmp.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
          containers:
            - name: outbox
              image: curlimages/curl:8.7.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - sh
                - -c
                - |
                  set -e
                  STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
                    -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    -H "Content-Type: application/json" \
                    "${APP_URL}/api/cron/outbox")
                  echo "HTTP ${STATUS}: $(cat /tmp/body)"
                  [ "${STATUS}" = "200" ] || exit 1
              env:
                - name: APP_URL
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: NEXT_PUBLIC_APP_URL
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: CRON_SECRET
