# Copie chaque nuit à 01h30 UTC (30 min après le dump, cronjob-backup.yaml) les fichiers
# chiffrés du volume des sauvegardes hors site, via rclone. Les fichiers sont déjà chiffrés
# AES-256 avant d'arriver ici : rclone ne voit et n'envoie que du contenu déjà illisible sans
# BACKUP_PASSPHRASE. Tout le volume est copié, quel que soit le format : benevoles_*.sql.gz.gpg
# (GnuPG) et l'ancien benevoles_*.sql.gz.enc (openssl), tant qu'il en reste.
#
# Namespace benevoles-offsite, pas benevoles : le compte de déploiement du workflow
# (k8s/rbac-ci-deployer.yaml) peut créer des Jobs dans benevoles, et un Job monte n'importe quel
# secret de son namespace. L'identifiant du stockage hors site (secret rclone-config), qui permet
# aussi d'y supprimer les copies, vit donc dans un namespace où ce compte n'a aucun droit.
# Rien de ce namespace n'est appliqué par deploy.yml : ce fichier s'applique à la main, après
# k8s/backup-offsite-namespace.yaml et les deux secrets, dans l'ordre de docs/deploiement.md
# « Mise en place / migration de la copie hors site » :
#   kubectl apply -f k8s/cronjob-backup-offsite.yaml
#
# Ce que le job lit, tout dans benevoles-offsite :
#   - le volume des sauvegardes, en lecture seule, par la réclamation backups-ro
#     (k8s/backup-offsite-namespace.yaml : le même répertoire du nœud que backup-pvc) ;
#   - le secret rclone-config (rclone.conf, remote "swissbackup") ;
#   - le secret offsite-settings : OFFSITE_BUCKET (nom du container), CRON_SECRET et APP_URL
#     (signal de vie). CRON_SECRET y est une copie : à recopier s'il change.
#
# Fournisseur : Infomaniak Swiss Backup (OpenStack Swift), stockage en Suisse, remote rclone
# "swissbackup" ; voir docs/deploiement.md « Copie hors site ».
#
# Utilise "copy" (upload uniquement) puis "delete --min-age" pour purger les fichiers de plus de
# 90 jours. Ce n'est volontairement pas "sync" : la rotation locale du volume est à 30 jours, donc
# un sync effacerait côté fournisseur tout fichier que le volume a déjà purgé, rendant la copie
# hors site inutile en cas de perte du cluster.
#
# --immutable : un fichier déjà envoyé n'est jamais réécrit. Qui détient le compte de déploiement
# peut encore modifier un dump sur backup-pvc (un Job de benevoles le monte) ; sans cette option,
# "copy --checksum" remplacerait la bonne copie hors site par le fichier modifié du même nom.
# Mesuré avec rclone 1.68 (backend local) : le fichier modifié est refusé, la copie hors site
# garde son contenu, les nouveaux fichiers de la même exécution sont quand même envoyés, et
# rclone sort en erreur (code 6). Le job s'arrête alors avant la purge et sans signal de vie : la
# page de santé et l'alerte nocturne le signalent, chaque nuit tant que le fichier modifié reste
# sur le volume.
#
# Mise en place du remote Swiss Backup (à faire une fois, en local, jamais dans ce dépôt) :
#   0. Dans le Manager Infomaniak, créer un appareil Swiss Backup « rclone » et lui donner un
#      mot de passe. Le Manager fournit un bloc rclone.conf de type "swift" (user, auth
#      https://swiss-backup02.infomaniak.com/identity/v3, tenant, region RegionOne...).
#   1. Coller ce bloc dans un rclone.conf local, renommer sa section en [swissbackup] et
#      remplacer key = [password] par le mot de passe de l'appareil.
#   2. Créer le container : rclone mkdir swissbackup:<container>, puis créer le secret :
#        kubectl create secret generic rclone-config -n benevoles-offsite \
#          --from-file=rclone.conf=$HOME/.config/rclone/rclone.conf
#      (à refaire si le mot de passe de l'appareil change).
#   3. Créer le secret offsite-settings (docs/deploiement.md).
#   4. Vérifier avec scripts/restore-test-offsite.sh (make restore-test-offsite).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-offsite
  namespace: benevoles-offsite
spec:
  schedule: "30 1 * * *"   # 01:30 UTC chaque nuit
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          # Selects the egress rule of k8s/backup-offsite-namespace.yaml: DNS, Traefik and the
          # internet on 443.
          labels:
            app: backup-offsite
        spec:
          restartPolicy: OnFailure
          # Hardened but still root (#1050), like the dump job: it reads the root-owned files of
          # the backup volume (read-only) and needs no capability for that.
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                # The read-only claim of this namespace on the directory of backup-pvc.
                claimName: backups-ro
                readOnly: true
            - name: rclone-config
              secret:
                secretName: rclone-config
          containers:
            - name: offsite-sync
              image: rclone/rclone:1.68
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
                # Nom du container Swiss Backup (OFFSITE_BUCKET), requis.
                - name: OFFSITE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: offsite-settings
                      key: OFFSITE_BUCKET
                # "true" fait passer --dry-run à rclone copy/delete (rien n'est envoyé ni
                # supprimé) : pour un test manuel avant de faire confiance à un nouveau remote.
                - name: DRY_RUN
                  value: "false"
                - name: APP_URL
                  valueFrom:
                    secretKeyRef:
                      name: offsite-settings
                      key: APP_URL
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: offsite-settings
                      key: CRON_SECRET
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                  readOnly: true
                - name: rclone-config
                  mountPath: /config/rclone
                  readOnly: true
              command:
                - sh
                - -c
                - |
                  set -e

                  # >>> OFFSITE_SCRIPT_START (kept in sync with scripts/test-offsite-backup.sh)
                  if [ -z "$OFFSITE_BUCKET" ]; then
                    echo "ERREUR : OFFSITE_BUCKET n'est pas défini (container Swiss Backup)." >&2
                    exit 1
                  fi
                  REMOTE="swissbackup:${OFFSITE_BUCKET}/benevol-backups"

                  DRY_RUN_FLAG=""
                  if [ "${DRY_RUN:-false}" = "true" ]; then
                    DRY_RUN_FLAG="--dry-run"
                    echo "==> DRY_RUN=true : rien ne sera envoyé ni supprimé côté Swiss Backup"
                  fi

                  # --immutable: a file already sent is never written over. A dump changed on the
                  # volume after its upload is refused, the new files of the run are still sent,
                  # and rclone exits non-zero: no purge, no heartbeat, the health page alerts.
                  echo "==> Envoi vers Swiss Backup (${REMOTE})"
                  if ! rclone copy /backups "$REMOTE" \
                    --config /config/rclone/rclone.conf \
                    --checksum --immutable -v $DRY_RUN_FLAG; then
                    echo "ERREUR : l'envoi a échoué, ou un fichier déjà envoyé a changé sur le volume (refusé, la copie hors site est intacte). Rien n'est purgé." >&2
                    exit 1
                  fi

                  echo "==> Purge des fichiers Swiss Backup de plus de 90 jours"
                  rclone delete "$REMOTE" \
                    --config /config/rclone/rclone.conf \
                    --min-age 90d -v $DRY_RUN_FLAG

                  echo "==> Inventaire Swiss Backup :"
                  rclone lsl "$REMOTE" --config /config/rclone/rclone.conf
                  # <<< OFFSITE_SCRIPT_END

                  # Heartbeat for the super-admin health page (#383); a failure to report must not fail the job.
                  # A dry run copies nothing, so it must not report a successful off-site copy.
                  [ "${DRY_RUN:-false}" = "true" ] && exit 0
                  wget -q -O - --post-data='{"job":"backup-offsite","ok":true}' \
                    --header="Authorization: Bearer ${CRON_SECRET}" --header="Content-Type: application/json" \
                    "${APP_URL}/api/cron/heartbeat" || echo "heartbeat non envoyé"
