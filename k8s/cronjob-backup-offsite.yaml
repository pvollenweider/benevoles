# Copie chaque nuit à 01h30 UTC (30 min après le dump, cronjob-backup.yaml) les fichiers
# chiffrés du volume backup-pvc hors site, via rclone. Les fichiers sont déjà chiffrés
# AES-256 avant d'arriver ici : rclone ne voit et n'envoie que du contenu déjà illisible sans
# BACKUP_PASSPHRASE.
#
# Fournisseur : Infomaniak Swiss Backup (OpenStack Swift), stockage en Suisse, remote rclone
# "swissbackup" ; voir docs/deploiement.md « Copie hors site ». Jusqu'au 2026-10-05 la copie
# partait vers un autre fournisseur, retiré depuis (#524, #697).
#
# Utilise "copy" (upload uniquement, ne touche jamais aux fichiers déjà présents côté
# fournisseur) puis "delete --min-age" pour purger les fichiers de plus de 90 jours. Ce n'est
# volontairement pas "sync" : la rotation locale du PVC est à 30 jours, donc un sync effacerait
# côté fournisseur tout fichier que le PVC a déjà purgé, rendant la copie hors site inutile en
# cas de perte du cluster (le PVC et son historique auraient disparu en même temps).
#
# Mise en place du remote Swiss Backup (à faire une fois, en local, jamais dans ce dépôt) :
#   0. Dans le Manager Infomaniak, créer un appareil Swiss Backup « rclone » et lui donner un
#      mot de passe. Le Manager fournit un bloc rclone.conf de type "swift" (user, auth
#      https://swiss-backup02.infomaniak.com/identity/v3, tenant, region RegionOne...).
#   1. Coller ce bloc dans un rclone.conf local, renommer sa section en [swissbackup] et
#      remplacer key = [password] par le mot de passe de l'appareil.
#   2. Créer le container : rclone mkdir swissbackup:<container>, puis créer le secret :
#        kubectl create secret generic rclone-config -n benevoles \
#          --from-file=rclone.conf=$HOME/.config/rclone/rclone.conf
#      (à refaire si le mot de passe de l'appareil change).
#   3. Ajouter le secret GitHub OFFSITE_BUCKET (nom du container) : repris dans
#      benevoles-secret au déploiement suivant (.github/workflows/deploy.yml).
#   4. Vérifier avec scripts/restore-test-offsite.sh (make restore-test-offsite).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-offsite
  namespace: benevoles
spec:
  schedule: "30 1 * * *"   # 01:30 UTC chaque nuit
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
                readOnly: true
            - name: rclone-config
              secret:
                secretName: rclone-config
          containers:
            - name: offsite-sync
              image: rclone/rclone:1.68
              env:
                # Nom du container Swiss Backup (OFFSITE_BUCKET), requis.
                - name: OFFSITE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: OFFSITE_BUCKET
                      optional: true
                # "true" fait passer --dry-run à rclone copy/delete (rien n'est envoyé ni
                # supprimé) : pour un test manuel avant de faire confiance à un nouveau remote.
                - name: DRY_RUN
                  value: "false"
                - name: APP_URL
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: NEXT_PUBLIC_APP_URL
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: CRON_SECRET
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                  readOnly: true
                - name: rclone-config
                  mountPath: /config/rclone
                  readOnly: true
              command:
                - sh
                - -c
                - |
                  set -e

                  # >>> OFFSITE_SCRIPT_START (kept in sync with scripts/test-offsite-backup.sh)
                  if [ -z "$OFFSITE_BUCKET" ]; then
                    echo "ERREUR : OFFSITE_BUCKET n'est pas défini (container Swiss Backup)." >&2
                    exit 1
                  fi
                  REMOTE="swissbackup:${OFFSITE_BUCKET}/benevol-backups"

                  DRY_RUN_FLAG=""
                  if [ "${DRY_RUN:-false}" = "true" ]; then
                    DRY_RUN_FLAG="--dry-run"
                    echo "==> DRY_RUN=true : rien ne sera envoyé ni supprimé côté Swiss Backup"
                  fi

                  echo "==> Envoi vers Swiss Backup (${REMOTE})"
                  rclone copy /backups "$REMOTE" \
                    --config /config/rclone/rclone.conf \
                    --checksum -v $DRY_RUN_FLAG

                  echo "==> Purge des fichiers Swiss Backup de plus de 90 jours"
                  rclone delete "$REMOTE" \
                    --config /config/rclone/rclone.conf \
                    --min-age 90d -v $DRY_RUN_FLAG

                  echo "==> Inventaire Swiss Backup :"
                  rclone lsl "$REMOTE" --config /config/rclone/rclone.conf
                  # <<< OFFSITE_SCRIPT_END

                  # Heartbeat for the super-admin health page (#383); a failure to report must not fail the job.
                  # A dry run copies nothing, so it must not report a successful off-site copy.
                  [ "${DRY_RUN:-false}" = "true" ] && exit 0
                  wget -q -O - --post-data='{"job":"backup-offsite","ok":true}' \
                    --header="Authorization: Bearer ${CRON_SECRET}" --header="Content-Type: application/json" \
                    "${APP_URL}/api/cron/heartbeat" || echo "heartbeat non envoyé"
