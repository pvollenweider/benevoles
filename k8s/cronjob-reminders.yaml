# Appelle POST /api/cron/reminders toutes les heures.
# Envoie les rappels automatiques aux bénévoles inscrits :
#   • J-2  : 47–49 h avant le début du créneau
#   • J-1  : 23–25 h avant le début du créneau
#   • Jour J : 2–4 h avant le début du créneau
# L'endpoint est idempotent : il marque chaque envoi et ne re-envoie pas.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-reminders
  namespace: benevoles
spec:
  schedule: "0 * * * *"   # toutes les heures pile
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # Restricted pod (#1050): curl_user (uid 100, gid 101) of the image, given as numbers for
          # runAsNonRoot; read-only root filesystem, the response body goes to an emptyDir /tmp.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
          containers:
            - name: reminders
              image: curlimages/curl:8.7.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - sh
                - -c
                - |
                  set -e
                  STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
                    -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    -H "Content-Type: application/json" \
                    "${APP_URL}/api/cron/reminders")
                  echo "HTTP ${STATUS}: $(cat /tmp/body)"
                  [ "${STATUS}" = "200" ] || exit 1
              env:
                - name: APP_URL
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: NEXT_PUBLIC_APP_URL
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: CRON_SECRET
