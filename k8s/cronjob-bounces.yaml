# Appelle POST /api/cron/bounces toutes les 15 minutes.
# Lit la boîte des notifications par IMAPS (Gandi Mail), enregistre un refus définitif arrivé
# après l'acceptation par le relais comme le même résultat qu'un refus immédiat (#602), puis
# déplace l'avis traité hors de la boîte de réception. Sans réglage IMAP, l'appel ne fait rien.
# L'endpoint est idempotent : un même avis ne marque l'adresse qu'une fois.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-bounces
  namespace: benevoles
spec:
  schedule: "*/15 * * * *"   # toutes les 15 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          # Selects the egress rule of k8s/networkpolicy.yaml: DNS and Traefik, nothing else.
          labels:
            app: benevoles-cron
        spec:
          restartPolicy: OnFailure
          # Restricted pod (#1050): curl_user (uid 100, gid 101) of the image, given as numbers for
          # runAsNonRoot; read-only root filesystem, the response body goes to an emptyDir /tmp.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
          containers:
            - name: bounces
              image: curlimages/curl:8.7.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - sh
                - -c
                - |
                  set -e
                  STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
                    -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    -H "Content-Type: application/json" \
                    "${APP_URL}/api/cron/bounces")
                  echo "HTTP ${STATUS}: $(cat /tmp/body)"
                  [ "${STATUS}" = "200" ] || exit 1
              env:
                - name: APP_URL
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: NEXT_PUBLIC_APP_URL
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: benevoles-secret
                      key: CRON_SECRET
