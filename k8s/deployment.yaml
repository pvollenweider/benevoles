apiVersion: apps/v1
kind: Deployment
metadata:
  name: benevoles-app
  namespace: benevoles
  labels:
    app: benevoles-app
spec:
  # Can be raised: rate limit counters are in Postgres, shared by every replica (#322), and the
  # notification outbox claims rows in the database. Migrations run in their own Job, not per pod.
  replicas: 1
  selector:
    matchLabels:
      app: benevoles-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: benevoles-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: app
          image: ${APP_IMAGE}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: benevoles-secret
          env:
            - name: NODE_ENV
              value: production
            # Migrations run once per deploy in k8s/job-migrate.yaml (#314), not in every pod.
            - name: MIGRATE_ON_START
              value: "false"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Ready only once the warm-up is over (docker-entrypoint.sh, scripts/warmup.mjs, capped at
          # 60 s): 503 until then, so with maxUnavailable 0 the old pod keeps the traffic meanwhile.
          # Then the same database check as /api/health. See src/lib/readiness.ts.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Independent of the warm-up: a slow one never gets the pod restarted.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
