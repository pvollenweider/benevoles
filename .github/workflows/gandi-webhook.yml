name: Build Gandi Webhook

# Pull requests only build the image (no push) so a broken Dockerfile or a Go
# version mismatch after a dependency bump is caught before merge. A push to
# main publishes :latest and :<sha>. The cluster picks up a new :latest at the
# next restart of the cert-manager-webhook-gandi pod.
on:
  push:
    branches: [main]
    paths:
      - "gandi-webhook/**"
  pull_request:
    branches: [main]
    paths:
      - "gandi-webhook/**"
      - ".github/workflows/gandi-webhook.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gandi-webhook

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gandi-webhook
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
