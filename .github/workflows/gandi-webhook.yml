name: Build Gandi Webhook

# Pull requests only build the image (no push) so a broken Dockerfile or a Go
# version mismatch after a dependency bump is caught before merge. A push to
# main publishes :latest and :<sha>. The cluster picks up a new :latest at the
# next restart of the cert-manager-webhook-gandi pod.
on:
  push:
    branches: [main]
    paths:
      - "k8s/gandi-webhook/**"
  pull_request:
    branches: [main]
    paths:
      - "k8s/gandi-webhook/**"
      - ".github/workflows/gandi-webhook.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gandi-webhook

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./k8s/gandi-webhook
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
