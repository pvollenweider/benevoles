name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  check:
    name: Type-check & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Type-check
        run: npx tsc --noEmit
        env:
          SENTRY_DSN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: scripts/doc-lastmod.mjs dates each doc source by its last commit.
          fetch-depth: 0

      - name: Date the doc sources
        run: node scripts/doc-lastmod.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        id: image
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHA}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            GIT_SHA=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Sync GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace=benevoles \
            --docker-server=ghcr.io \
            --docker-username=pvollenweider \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Check required secrets
        env:
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          # The app refuses to start in production without it (src/lib/production-guards.ts);
          # fail here, before touching the cluster, rather than on a stuck rollout.
          if [ -z "$TOKEN_ENCRYPTION_KEY" ]; then
            echo "::error::TOKEN_ENCRYPTION_KEY secret is not set (gh secret set TOKEN_ENCRYPTION_KEY)"
            exit 1
          fi

      - name: Sync k8s secret
        run: |
          kubectl create secret generic benevoles-secret \
            --namespace=benevoles \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/benevoles" \
            --from-literal=AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
            --from-literal=ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            --from-literal=ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            --from-literal=SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            --from-literal=SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            --from-literal=SMTP_SECURE="${{ secrets.SMTP_SECURE }}" \
            --from-literal=SMTP_USER="${{ secrets.SMTP_USER }}" \
            --from-literal=SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            --from-literal=EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
            --from-literal=EMAIL_REPLY_TO="${{ secrets.EMAIL_REPLY_TO }}" \
            --from-literal=ADMIN_NOTIFICATION_EMAIL="${{ secrets.ADMIN_NOTIFICATION_EMAIL }}" \
            --from-literal=CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            --from-literal=VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            --from-literal=VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
            --from-literal=TOKEN_ENCRYPTION_KEY="${{ secrets.TOKEN_ENCRYPTION_KEY }}" \
            --from-literal=TOKEN_ENCRYPTION_KEY_ID="${{ secrets.TOKEN_ENCRYPTION_KEY_ID }}" \
            --from-literal=TOKEN_ENCRYPTION_PREVIOUS_KEYS="${{ secrets.TOKEN_ENCRYPTION_PREVIOUS_KEYS }}" \
            --from-literal=SENTRY_DSN="${{ secrets.SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}" \
            --from-literal=NEXT_PUBLIC_APP_URL="https://www.benevol.app" \
            --from-literal=AUTH_URL="https://www.benevol.app" \
            --from-literal=AUTH_TRUST_HOST="true" \
            --from-literal=VIDEO_MEDIA_BASE_URL="https://medias.benevol.app" \
            --from-literal=OFFSITE_BUCKET="${{ secrets.OFFSITE_BUCKET }}" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: kubectl apply -f k8s/postgres.yaml

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status deployment/postgres \
            -n benevoles --timeout=120s

      - name: Run database migrations
        env:
          APP_IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          # Once per deploy, from the new image, before the app is updated (#314). The app pods
          # no longer migrate on start. On failure the deploy stops and the running version
          # keeps serving: migrations must stay compatible with it (CONTRIBUTING, expand/contract).
          kubectl delete job benevoles-migrate -n benevoles --ignore-not-found --wait=true
          export APP_IMAGE
          envsubst < k8s/job-migrate.yaml | kubectl apply -f -
          for i in $(seq 1 60); do
            succeeded=$(kubectl get job benevoles-migrate -n benevoles -o jsonpath='{.status.succeeded}')
            failed=$(kubectl get job benevoles-migrate -n benevoles -o jsonpath='{.status.failed}')
            if [ "$succeeded" = "1" ]; then kubectl logs job/benevoles-migrate -n benevoles; exit 0; fi
            if [ -n "$failed" ] && [ "$failed" != "0" ]; then
              kubectl logs job/benevoles-migrate -n benevoles || true
              echo "::error::Database migration failed"
              exit 1
            fi
            sleep 5
          done
          kubectl logs job/benevoles-migrate -n benevoles || true
          echo "::error::Database migration timed out"
          exit 1

      - name: Deploy app
        env:
          APP_IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/ingressroute-tokens.yaml
          kubectl apply -f k8s/cronjob-reminders.yaml
          kubectl apply -f k8s/cronjob-cleanup.yaml
          kubectl apply -f k8s/cronjob-release-check.yaml
          kubectl apply -f k8s/cronjob-backup.yaml
          kubectl apply -f k8s/cronjob-backup-offsite.yaml
          export APP_IMAGE
          envsubst < k8s/deployment.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/benevoles-app \
            -n benevoles --timeout=300s
