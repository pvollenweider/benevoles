name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  check:
    name: Type-check & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Type-check
        run: npx tsc --noEmit
        env:
          SENTRY_DSN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/doc-lastmod.mjs dates each doc source by its last commit.
          fetch-depth: 0

      - name: Date the doc sources
        run: node scripts/doc-lastmod.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        id: image
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHA}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            GIT_SHA=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Configure kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Sync GHCR pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace=benevoles \
            --docker-server=ghcr.io \
            --docker-username=pvollenweider \
            --docker-password="$GHCR_PULL_TOKEN" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Check required secrets
        env:
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          # The app refuses to start in production without it (src/lib/production-guards.ts);
          # fail here, before touching the cluster, rather than on a stuck rollout.
          if [ -z "$TOKEN_ENCRYPTION_KEY" ]; then
            echo "::error::TOKEN_ENCRYPTION_KEY secret is not set (gh secret set TOKEN_ENCRYPTION_KEY)"
            exit 1
          fi

      - name: Sync k8s secret
        # Values come from the step environment, never from the script text: each line of the
        # key file is a bare key name, which makes kubectl read that key's value from its own
        # environment (os.Getenv in --from-env-file). No secret goes through the shell, argv,
        # a file on disk or the log.
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/benevoles"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          OPERATOR_ALERT_EMAIL: ${{ secrets.OPERATOR_ALERT_EMAIL }}
          SIGNUP: ${{ secrets.SIGNUP }}
          ORG_INACTIVITY: ${{ secrets.ORG_INACTIVITY }}
          PAST_EVENT_RETENTION: ${{ secrets.PAST_EVENT_RETENTION }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TOKEN_ENCRYPTION_KEY_ID: ${{ secrets.TOKEN_ENCRYPTION_KEY_ID }}
          TOKEN_ENCRYPTION_PREVIOUS_KEYS: ${{ secrets.TOKEN_ENCRYPTION_PREVIOUS_KEYS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_APP_URL: "https://www.benevol.app"
          HOSTED_SERVICE: "true"
          AUTH_URL: "https://www.benevol.app"
          AUTH_TRUST_HOST: "true"
          VIDEO_MEDIA_BASE_URL: "https://medias.benevol.app"
          OFFSITE_BUCKET: ${{ secrets.OFFSITE_BUCKET }}
        run: |
          keys="$RUNNER_TEMP/benevoles-secret.keys"
          cat > "$keys" <<'KEYS'
          POSTGRES_USER
          POSTGRES_PASSWORD
          DATABASE_URL
          AUTH_SECRET
          ADMIN_EMAIL
          ADMIN_PASSWORD
          SMTP_HOST
          SMTP_PORT
          SMTP_SECURE
          SMTP_USER
          SMTP_PASSWORD
          EMAIL_FROM
          EMAIL_REPLY_TO
          ADMIN_NOTIFICATION_EMAIL
          NTFY_URL
          NTFY_TOKEN
          OPERATOR_ALERT_EMAIL
          SIGNUP
          ORG_INACTIVITY
          PAST_EVENT_RETENTION
          CRON_SECRET
          VAPID_PUBLIC_KEY
          VAPID_PRIVATE_KEY
          TOKEN_ENCRYPTION_KEY
          TOKEN_ENCRYPTION_KEY_ID
          TOKEN_ENCRYPTION_PREVIOUS_KEYS
          SENTRY_DSN
          NEXT_PUBLIC_APP_URL
          HOSTED_SERVICE
          AUTH_URL
          AUTH_TRUST_HOST
          VIDEO_MEDIA_BASE_URL
          OFFSITE_BUCKET
          KEYS
          kubectl create secret generic benevoles-secret \
            --namespace=benevoles \
            --from-env-file="$keys" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$keys"

      - name: Deploy PostgreSQL
        run: kubectl apply -f k8s/postgres.yaml

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status deployment/postgres \
            -n benevoles --timeout=120s

      # Before the migration on purpose (#1050): the migration Job and the new app pod then open
      # fresh connections through these rules within this deploy (open connections are kept by
      # the policy controller, so a check right after applying would prove nothing).
      - name: Apply NetworkPolicy
        id: netpol
        run: kubectl apply -f k8s/networkpolicy.yaml

      - name: Run database migrations
        env:
          APP_IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          # Once per deploy, from the new image, before the app is updated (#314). The app pods
          # no longer migrate on start. On failure the deploy stops and the running version
          # keeps serving: migrations must stay compatible with it (CONTRIBUTING, expand/contract).
          kubectl delete job benevoles-migrate -n benevoles --ignore-not-found --wait=true
          export APP_IMAGE
          envsubst < k8s/job-migrate.yaml | kubectl apply -f -
          for i in $(seq 1 60); do
            succeeded=$(kubectl get job benevoles-migrate -n benevoles -o jsonpath='{.status.succeeded}')
            failed=$(kubectl get job benevoles-migrate -n benevoles -o jsonpath='{.status.failed}')
            if [ "$succeeded" = "1" ]; then kubectl logs job/benevoles-migrate -n benevoles; exit 0; fi
            if [ -n "$failed" ] && [ "$failed" != "0" ]; then
              kubectl logs job/benevoles-migrate -n benevoles || true
              echo "::error::Database migration failed"
              exit 1
            fi
            sleep 5
          done
          kubectl logs job/benevoles-migrate -n benevoles || true
          echo "::error::Database migration timed out"
          exit 1

      - name: Deploy app
        env:
          APP_IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/middleware-compress.yaml
          kubectl apply -f k8s/middleware-hsts.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/ingressroute-tokens.yaml
          kubectl apply -f k8s/ingressroute-http.yaml
          kubectl apply -f k8s/cronjob-reminders.yaml
          kubectl apply -f k8s/cronjob-outbox.yaml
          kubectl apply -f k8s/cronjob-cleanup.yaml
          kubectl apply -f k8s/cronjob-release-check.yaml
          kubectl apply -f k8s/cronjob-backup.yaml
          kubectl apply -f k8s/cronjob-backup-offsite.yaml
          export APP_IMAGE
          envsubst < k8s/deployment.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/benevoles-app \
            -n benevoles --timeout=300s

      # The public addresses, through Traefik, after the new pod took the traffic: they cross the
      # NetworkPolicy like every visitor. A few retries for a slow first answer.
      - name: Check the site through the NetworkPolicy
        run: |
          fail=0
          for url in https://www.benevol.app/api/health/ready https://www.benevol.app/ \
            https://www.benevol.app/admin/login https://medias.benevol.app/healthz; do
            code=000
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$code $url"
            # Stop at the first failure: the next step removes the policy straight away.
            [ "$code" = "200" ] || { fail=1; break; }
          done
          [ "$fail" = "0" ] || { echo "::error::The site does not answer through the NetworkPolicy"; exit 1; }

      # Any failure once the policy is in place (migration, rollout, the check above) removes it:
      # the site must keep answering, isolation comes back with the next successful deploy.
      - name: Remove NetworkPolicy after a failure
        if: failure() && steps.netpol.outcome == 'success'
        run: |
          kubectl -n benevoles delete networkpolicy -l app.kubernetes.io/part-of=benevoles-netpol --ignore-not-found
          echo "::warning::NetworkPolicy removed after a failed deploy (k8s/networkpolicy.yaml)"
