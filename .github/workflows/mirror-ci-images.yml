name: Mirror CI images

# Copies the service images used by CI (Postgres, Mailpit) to ghcr.io/<owner>/benevoles-ci/*.
# CI jobs pull them from there with the job's GITHUB_TOKEN instead of anonymously: anonymous
# pulls from ECR Public share a data quota across GitHub runner IPs and failed with
# « toomanyrequests: Data limit exceeded » at « Initialize containers ».
# The copy keeps every platform of the upstream tag (imagetools create, no local pull).

on:
  workflow_dispatch:
  schedule:
    # Weekly refresh, Monday 04:17 UTC: picks up upstream patch releases of the same tags.
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths: [.github/workflows/mirror-ci-images.yml]
  # Runs when this file changes in a PR from this repository, so a new or updated image exists
  # before the CI change that uses it (workflow_dispatch only exists once the file is on main).
  pull_request:
    branches: [main]
    paths: [.github/workflows/mirror-ci-images.yml]

permissions:
  contents: read

concurrency:
  group: mirror-ci-images
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror ${{ matrix.name }}:${{ matrix.tag }}
    # Fork PRs get a read-only token and cannot push: skip them explicitly.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            tag: 16-alpine
            sources: "public.ecr.aws/docker/library/postgres docker.io/library/postgres"
          - name: mailpit
            tag: latest
            sources: "ghcr.io/axllent/mailpit docker.io/axllent/mailpit"
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the upstream tag to GHCR
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ matrix.tag }}
          SOURCES: ${{ matrix.sources }}
          OWNER: ${{ github.repository_owner }}
        run: |
          target="ghcr.io/${OWNER,,}/benevoles-ci/${NAME}:${TAG}"
          # Each upstream registry in turn, three attempts each: one rate-limited source is not fatal.
          for attempt in 1 2 3; do
            for source in $SOURCES; do
              echo "Copying ${source}:${TAG} -> ${target} (attempt ${attempt})"
              if docker buildx imagetools create --tag "$target" "${source}:${TAG}"; then
                docker buildx imagetools inspect "$target"
                echo "Mirrored \`${source}:${TAG}\` to \`${target}\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
            sleep $((attempt * 20))
          done
          echo "::error::Could not copy ${NAME}:${TAG} from any of: ${SOURCES}"
          exit 1
