name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the pull request cancels the run of the previous push: its result no longer says
# anything about the branch. Production deploys are not concerned (deploy.yml).
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Agent-written copy carries « <!-- BROUILLON » until the owner rewrites it (#872): this job stays
  # red until every marker is gone, so a draft is never merged (scripts/check-no-draft-content.mjs).
  draft-content:
    name: Draft content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: No public content source is still a draft
        run: node scripts/check-no-draft-content.mjs

  check:
    name: Type-check, lint & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base), for the migration check.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Type-check
        run: npx tsc --noEmit
        env:
          SENTRY_DSN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:coverage

      - name: SECURITY.md is up to date with the current version
        run: node scripts/check-security-md.mjs

      - name: Migrations stay compatible with the previous release
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-migrations.mjs

      - name: Documentation captures follow the screens they show
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-doc-screenshots.mjs
        env:
          # Read by the script, never interpolated into a shell command.
          PR_BODY: ${{ github.event.pull_request.body }}

  # One `next build` per run, shared by the E2E shards and Lighthouse (they used to build it each).
  # Same runner image, Node, lockfile and commit as its consumers, which check all of it against
  # the manifest (scripts/ci-build-artifact.mjs) before starting `next start` on it. No database:
  # the build reads none (checked: same output with an unreachable one). The production image is
  # built separately, on Alpine, by deploy.yml.
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    env:
      # The build-time settings the E2E and Lighthouse jobs used for their own builds. Only the
      # NEXT_PUBLIC_* values end up in the build; the consumers must have the same ones.
      DATABASE_URL: postgresql://benevoles:benevoles@localhost:5432/benevoles_e2e
      # Throwaway secrets, CI-only — never used outside this ephemeral job.
      AUTH_SECRET: ci-e2e-only-secret-not-used-anywhere-else-0000
      TOKEN_ENCRYPTION_KEY: Y2ktZTJlLW9ubHktdG9rZW4ta2V5LTMyLWJ5dGVzISE=
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Package the build
        # .next without what `next start` does not read: the Turbopack cache (saved nowhere, see
        # docs/deploiement.md), the standalone copy (Docker only), traces. tar keeps Turbopack's
        # relative symlinks into node_modules, which the consumers install from the same lockfile.
        run: |
          node scripts/ci-build-artifact.mjs write .next/ci-build.json
          tar --exclude=.next/cache --exclude=.next/standalone --exclude=.next/trace \
            --exclude=.next/diagnostics --exclude=.next/types \
            -cf - .next | zstd -T0 -3 -q -o next-build.tar.zst
          ls -l next-build.tar.zst

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: next-build.tar.zst
          if-no-files-found: error
          # Already compressed. Kept for re-runs of a failed job, not as a deliverable.
          compression-level: 0
          retention-days: 3
          # « Re-run all jobs » builds again and replaces it.
          overwrite: true

  e2e:
    # Two shards of the suite, each with its own Postgres, Mailpit and seed (files split by
    # Playwright, --shard): the suite stays sequential inside a shard.
    name: E2E (Playwright, ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      # Pull the mirrored service images from GHCR.
      packages: read

    services:
      postgres:
        # Mirrored by mirror-ci-images.yml, pulled with the job token: anonymous ECR Public pulls hit
        # « toomanyrequests: Data limit exceeded » (shared quota across runner IPs).
        image: ghcr.io/pvollenweider/benevoles-ci/postgres:16-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: benevoles_e2e
          POSTGRES_USER: benevoles
          POSTGRES_PASSWORD: benevoles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U benevoles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: ghcr.io/pvollenweider/benevoles-ci/mailpit:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports: ["1025:1025", "8025:8025"]
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

    env:
      DATABASE_URL: postgresql://benevoles:benevoles@localhost:5432/benevoles_e2e
      # Throwaway secret, CI-only — never used outside this ephemeral job.
      AUTH_SECRET: ci-e2e-only-secret-not-used-anywhere-else-0000
      # Throwaway key, CI-only: runs E2E through the encrypted-token path (#290).
      TOKEN_ENCRYPTION_KEY: Y2ktZTJlLW9ubHktdG9rZW4ta2V5LTMyLWJ5dGVzISE=
      ADMIN_EMAIL: admin@localhost
      ADMIN_PASSWORD: ci-e2e-admin-password
      ORG_ADMIN_EMAIL: org-admin@localhost
      ORG_ADMIN_PASSWORD: ci-e2e-org-admin-password
      # Deliberately distinct from ORG_ADMIN_EMAIL — registration.spec.ts
      # asserts admin notifications never land here (see src/lib/notification-helpers.ts).
      ADMIN_NOTIFICATION_EMAIL: fallback-should-not-receive@localhost
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: dev
      SMTP_PASSWORD: dev
      EMAIL_FROM: "Bénévoles e2e <notifications@benevol.app>"
      MAILPIT_URL: http://localhost:8025
      # Grouped emails (#869) leave at once here: the specs read them without waiting for a cron.
      DIGEST_DELAY_SECONDS: "0"
      # Throwaway, CI-only: scheduled-message.spec.ts invokes the outbox cron route (#1019), which
      # `next start` (production mode) refuses without a secret.
      CRON_SECRET: ci-e2e-only-cron-not-used-anywhere-else
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      E2E_PORT: "3100"
      # Run the suite against `next build` + `next start` (#592), as in production: no on-demand
      # compilation under load, and build-time behaviour (prerendering) is exercised. The build is
      # the build job's; `prebuilt` only starts it (playwright.config.ts).
      E2E_SERVER: prebuilt

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build

      - name: Unpack and check the build
        # Refuses a build of another commit, tree, lockfile, Node major or NEXT_PUBLIC_* value,
        # or from another run (scripts/ci-build-artifact.mjs).
        run: |
          zstd -d -q -c next-build.tar.zst | tar -xf -
          rm next-build.tar.zst
          node scripts/ci-build-artifact.mjs verify .next/ci-build.json

      - name: Migrate + seed e2e database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Integration tests (real Postgres)
        # Migrations on a database with data (#318) and the outbox under concurrency (#319).
        # Once per run, in the first shard (before its Playwright specs, on the same database as before).
        if: matrix.shard == 1
        run: npm run test:integration

      - name: Install Playwright browsers
        # WebKit for the "webkit-iphone" project (e2e/mobile/, iPhone emulation).
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e tests
        # Both projects: "chromium" (whole suite) and "webkit-iphone" (e2e/mobile/ only), split
        # by file between the shards.
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the mirrored service images from GHCR.
      packages: read

    # Same database and seed as the E2E job, against `next start` on the build job's build (#773).
    # Fails below the thresholds of lighthouserc.cjs (100 in accessibility, best practices and SEO,
    # 95 in desktop performance); mobile performance and the video library's SEO only warn.
    services:
      postgres:
        # Mirrored by mirror-ci-images.yml, pulled with the job token: anonymous ECR Public pulls hit
        # « toomanyrequests: Data limit exceeded » (shared quota across runner IPs).
        image: ghcr.io/pvollenweider/benevoles-ci/postgres:16-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: benevoles_e2e
          POSTGRES_USER: benevoles
          POSTGRES_PASSWORD: benevoles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U benevoles"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://benevoles:benevoles@localhost:5432/benevoles_e2e
      # Throwaway secrets, CI-only — never used outside this ephemeral job.
      AUTH_SECRET: ci-e2e-only-secret-not-used-anywhere-else-0000
      TOKEN_ENCRYPTION_KEY: Y2ktZTJlLW9ubHktdG9rZW4ta2V5LTMyLWJ5dGVzISE=
      ADMIN_EMAIL: admin@localhost
      ADMIN_PASSWORD: ci-e2e-admin-password
      ORG_ADMIN_EMAIL: org-admin@localhost
      ORG_ADMIN_PASSWORD: ci-e2e-org-admin-password
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      E2E_PORT: "3100"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build

      - name: Unpack and check the build
        # Refuses a build of another commit, tree, lockfile, Node major or NEXT_PUBLIC_* value,
        # or from another run (scripts/ci-build-artifact.mjs).
        run: |
          zstd -d -q -c next-build.tar.zst | tar -xf -
          rm next-build.tar.zst
          node scripts/ci-build-artifact.mjs verify .next/ci-build.json

      - name: Migrate + seed e2e database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Lighthouse CI (mobile and desktop)
        # One run per URL and form factor. Reports go to temporary public storage (the repo is
        # public; links are printed in the log) and to the workflow artifact below.
        # Both form factors are always measured and uploaded; the step fails at the end if either
        # missed a threshold.
        run: |
          failed=0
          for form_factor in mobile desktop; do
            export LHCI_FORM_FACTOR=$form_factor
            npx lhci collect --config=lighthouserc.cjs
            npx lhci assert --config=lighthouserc.cjs || failed=1
            npx lhci upload --config=lighthouserc.cjs --target=temporary-public-storage || true
            npx lhci upload --config=lighthouserc.cjs --target=filesystem --outputDir=lighthouse-reports/$form_factor
          done
          exit $failed

      - name: Score summary
        if: always()
        run: node scripts/lighthouse-summary.mjs lighthouse-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
