version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Minor and patch updates only: majors come as one PR per package, since they can need a
      # migration (#263 bundled @sentry/nextjs 11 and TypeScript 7 with safe bumps and couldn't
      # be merged as a whole).
      all-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint-plugin-react (via eslint-config-next) doesn't support ESLint 10 yet
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    labels: ["deps"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["deps"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["deps"]
