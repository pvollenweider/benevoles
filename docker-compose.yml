# Local prod-like stack (`docker compose up -d` — see README). `name:` explicit so this never
# shares a Compose project with docker-compose.dev.yml or docker-compose.e2e.yml, which declare
# services with the same names ("postgres", "mailpit"/none here) — see docker-compose.e2e.yml's
# comment for what happens without it. Matches the directory-name default this already had, so no
# volume rename/migration needed (still resolves to benevoles_postgres_data).
#
# PostgreSQL is reachable only by the app, on the Compose network: no port on the host. Its
# password is required (POSTGRES_PASSWORD, in .env next to this file or exported), with no default.
# On a volume that already exists, PostgreSQL keeps the password it was created with: see
# docs/deploiement.md before changing it. Local access: docker-compose.override.example.yml.
name: benevoles

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: benevoles
      POSTGRES_USER: benevoles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis, voir docs/deploiement.md}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benevoles"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # docker-entrypoint.sh builds DATABASE_URL from these, each part encoded (any password works).
      POSTGRES_HOST: postgres
      POSTGRES_DB: benevoles
      POSTGRES_USER: benevoles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis, voir docs/deploiement.md}
      # Required, no default: a random value of your own (openssl rand -base64 32).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET est requis, générer une valeur avec openssl rand -base64 32 (voir docs/deploiement.md)}
      # Required by the production image (openssl rand -base64 32); the server won't start
      # without it. Never change or lose it once used — see README.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
