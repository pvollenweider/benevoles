# Juste PostgreSQL — pour développer avec `npm run dev` en local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: benevoles
      POSTGRES_USER: benevoles
      POSTGRES_PASSWORD: benevoles
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benevoles"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
